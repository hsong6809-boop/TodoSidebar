<svg xmlns="http://www.w3.org/2000/svg" width="380" height="840" viewBox="0 0 380 840" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <!-- 桌面底 -->
  <rect width="380" height="840" fill="#E8ECF5"/>
  <!-- 窗口投影 -->
  <rect x="18" y="14" width="344" height="812" rx="22" fill="#0F172A" opacity="0.10"/>
  <!-- 窗口主体 -->
  <rect x="10" y="8" width="344" height="812" rx="20" fill="#F8F9FE" stroke="#E4E9F2"/>

  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="xpbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- ===== 头部：问候 ===== -->
  <circle cx="46" cy="52" r="23" fill="url(#brand)"/>
  <path d="M37 53 l6 6 l12 -13" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="80" y="47" font-size="16" font-weight="600" fill="#0F172A">早上好，Alex</text>
  <text x="80" y="66" font-size="11" fill="#64748B">8月22日 周五 · 6 项待办</text>
  <!-- 右侧两个圆形图标按钮 -->
  <circle cx="296" cy="50" r="15" fill="#0F172A" opacity="0.05"/>
  <g stroke="#64748B" stroke-width="1.6" stroke-linecap="round">
    <line x1="290" y1="45" x2="302" y2="45"/><line x1="290" y1="50" x2="302" y2="50"/><line x1="290" y1="55" x2="302" y2="55"/>
    <circle cx="294" cy="45" r="1.9" fill="#F8F9FE"/><circle cx="300" cy="50" r="1.9" fill="#F8F9FE"/><circle cx="293" cy="55" r="1.9" fill="#F8F9FE"/>
  </g>
  <circle cx="326" cy="50" r="15" fill="#0F172A" opacity="0.05"/>
  <path d="M330 43 l-8 7 l8 7" stroke="#64748B" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== 今日进度 Hero 卡 ===== -->
  <rect x="24" y="96" width="316" height="76" rx="16" fill="#FFFFFF" stroke="#EAEEF6"/>
  <circle cx="58" cy="134" r="24" fill="none" stroke="#EEF1F8" stroke-width="7"/>
  <circle cx="58" cy="134" r="24" fill="none" stroke="#6366F1" stroke-width="7" stroke-linecap="round"
          stroke-dasharray="102.7 150.8" transform="rotate(-90 58 134)"/>
  <text x="58" y="139" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">68%</text>
  <text x="96" y="124" font-size="11" fill="#64748B">今日进度</text>
  <text x="96" y="147" font-size="18" font-weight="700" fill="#0F172A">13<tspan font-size="12" fill="#94A3B8" font-weight="400"> / 19</tspan></text>
  <rect x="216" y="112" width="106" height="24" rx="12" fill="#FFF7ED"/>
  <text x="269" y="128" font-size="11" font-weight="600" fill="#EA580C" text-anchor="middle">🔥 连击 6 天</text>
  <rect x="216" y="142" width="106" height="22" rx="11" fill="#EEF2FF"/>
  <text x="230" y="157" font-size="10.5" font-weight="600" fill="#4F46E5">Lv.12 冒险者</text>
  <rect x="292" y="151" width="24" height="4" rx="2" fill="#C7D2FE"/>
  <rect x="292" y="151" width="15" height="4" rx="2" fill="url(#xpbar)"/>

  <!-- ===== 快速添加 Composer ===== -->
  <rect x="24" y="186" width="316" height="40" rx="12" fill="#FFFFFF" stroke="#DDE3EE"/>
  <circle cx="44" cy="206" r="9" fill="#EEF2FF"/>
  <path d="M44 201.5 v9 M39.5 206 h9" stroke="#6366F1" stroke-width="1.8" stroke-linecap="round"/>
  <text x="62" y="211" font-size="12" fill="#94A3B8">添加任务，回车确认…</text>
  <rect x="292" y="192" width="42" height="28" rx="8" fill="url(#brand)"/>
  <path d="M306 206 h14 M313 199 v14" stroke="#fff" stroke-width="2" stroke-linecap="round"/>

