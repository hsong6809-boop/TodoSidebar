  <text x="26" y="256" font-size="13" font-weight="600" fill="#334155">今天</text>
  <rect x="60" y="243" width="22" height="18" rx="9" fill="#EEF2FF"/>
  <text x="71" y="256" font-size="11" font-weight="600" fill="#4F46E5" text-anchor="middle">6</text>
  <g transform="translate(316,250)" stroke="#94A3B8" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M2 3 h12 M4 3 v0 M11 8 h3 M2 13 h12"/>
    <circle cx="7" cy="3" r="2.2" fill="#F8F9FE"/><circle cx="9" cy="13" r="2.2" fill="#F8F9FE"/>
  </g>

  <!-- ===== 任务卡 1：截止任务 ===== -->
  <rect x="24" y="270" width="316" height="58" rx="14" fill="#FFFFFF" stroke="#EAEEF6"/>
  <rect x="24" y="270" width="4" height="58" rx="2" fill="#F59E0B"/>
  <circle cx="50" cy="299" r="9.5" fill="none" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="68" y="294" font-size="12.5" font-weight="500" fill="#0F172A">写产品周报并发送</text>
  <rect x="68" y="301" width="88" height="19" rx="9.5" fill="#FFF7ED"/>
  <circle cx="78" cy="310.5" r="2.5" fill="#F59E0B"/>
  <text x="86" y="314.5" font-size="10" font-weight="600" fill="#B45309">明天 18:00 截止</text>
  <rect x="162" y="301" width="52" height="19" rx="9.5" fill="#FEF2F2"/>
  <text x="188" y="314.5" font-size="10" font-weight="600" fill="#DC2626" text-anchor="middle">高优先</text>

  <!-- 任务卡 2：每日任务 + 子任务进度 -->
  <rect x="24" y="336" width="316" height="58" rx="14" fill="#FFFFFF" stroke="#EAEEF6"/>
  <rect x="24" y="336" width="4" height="58" rx="2" fill="#10B981"/>
  <circle cx="50" cy="365" r="9.5" fill="none" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="68" y="360" font-size="12.5" font-weight="500" fill="#0F172A">晨间阅读 30 分钟</text>
  <rect x="68" y="367" width="46" height="19" rx="9.5" fill="#EEF2FF"/>
  <text x="91" y="380.5" font-size="10" font-weight="600" fill="#4F46E5" text-anchor="middle">每日</text>
  <rect x="122" y="370" width="70" height="5" rx="2.5" fill="#EEF1F8"/>
  <rect x="122" y="370" width="42" height="5" rx="2.5" fill="#10B981"/>
  <text x="198" y="377" font-size="10" font-weight="600" fill="#10B981">3/5</text>

  <!-- 任务卡 3 -->
  <rect x="24" y="402" width="316" height="58" rx="14" fill="#FFFFFF" stroke="#EAEEF6"/>
  <rect x="24" y="402" width="4" height="58" rx="2" fill="#F59E0B"/>
  <circle cx="50" cy="431" r="9.5" fill="none" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="68" y="426" font-size="12.5" font-weight="500" fill="#0F172A">代码评审：PR #142</text>
  <rect x="68" y="433" width="46" height="19" rx="9.5" fill="#EEF2FF"/>
  <text x="91" y="446.5" font-size="10" font-weight="600" fill="#4F46E5" text-anchor="middle">每日</text>
  <rect x="122" y="436" width="52" height="19" rx="9.5" fill="#F1F5F9"/>
  <text x="148" y="449.5" font-size="10" fill="#64748B" text-anchor="middle">📋 1/2</text>

  <!-- 任务卡 4：已完成态 -->
  <rect x="24" y="468" width="316" height="58" rx="14" fill="#FFFFFF" stroke="#EAEEF6" opacity="0.75"/>
  <circle cx="50" cy="497" r="9.5" fill="#10B981"/>
  <path d="M45.5 497 l3.2 3.2 l6 -6.5" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="68" y="492" font-size="12.5" fill="#94A3B8" text-decoration="line-through">晨间站会</text>
  <rect x="68" y="499" width="46" height="19" rx="9.5" fill="#EEF2FF" opacity="0.6"/>
  <text x="91" y="512.5" font-size="10" fill="#818CF8" text-anchor="middle">每日</text>
  <text x="308" y="502" font-size="10" fill="#CBD5E1">09:42</text>

  <!-- 折叠分组 -->
  <rect x="24" y="540" width="316" height="34" rx="10" fill="#0F172A" opacity="0.04"/>
  <path d="M42 553 l4.5 5 l4.5 -5" stroke="#64748B" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="60" y="561" font-size="12" font-weight="600" fill="#64748B">已完成 · 13</text>
  <text x="322" y="561" font-size="10.5" fill="#94A3B8">展开</text>

  <!-- 迷你日历条 -->
  <text x="26" y="606" font-size="13" font-weight="600" fill="#334155">本周概览</text>
  <rect x="24" y="618" width="316" height="64" rx="14" fill="#FFFFFF" stroke="#EAEEF6"/>
  <g font-size="9" fill="#94A3B8" text-anchor="middle">
    <text x="52" y="638">一</text><text x="94" y="638">二</text><text x="136" y="638">三</text>
    <text x="178" y="638">四</text><text x="220" y="638">五</text><text x="262" y="638">六</text><text x="304" y="638">日</text>
  </g>
  <g>
    <rect x="40" y="646" width="24" height="26" rx="8" fill="#EEF1F8"/><text x="52" y="663" font-size="10" fill="#64748B" text-anchor="middle">18</text>
    <rect x="82" y="646" width="24" height="26" rx="8" fill="#EEF1F8"/><text x="94" y="663" font-size="10" fill="#64748B" text-anchor="middle">19</text>
    <rect x="124" y="646" width="24" height="26" rx="8" fill="#EEF1F8"/><text x="136" y="663" font-size="10" fill="#64748B" text-anchor="middle">20</text>
    <rect x="166" y="646" width="24" height="26" rx="8" fill="#EEF1F8"/><text x="178" y="663" font-size="10" fill="#64748B" text-anchor="middle">21</text>
    <rect x="208" y="644" width="24" height="30" rx="8" fill="#6366F1"/><text x="220" y="663" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">22</text>
    <rect x="250" y="646" width="24" height="26" rx="8" fill="#EEF1F8"/><text x="262" y="663" font-size="10" fill="#94A3B8" text-anchor="middle">23</text>
    <rect x="292" y="646" width="24" height="26" rx="8" fill="#EEF1F8"/><text x="304" y="663" font-size="10" fill="#94A3B8" text-anchor="middle">24</text>
  </g>
  <g>
    <circle cx="58" cy="679" r="2" fill="#10B981"/><circle cx="100" cy="679" r="2" fill="#10B981"/>
    <circle cx="142" cy="679" r="2" fill="#10B981"/><circle cx="184" cy="679" r="2" fill="#10B981"/>
    <circle cx="220" cy="681" r="2.5" fill="#fff"/>
  </g>

  <!-- ===== 底部 Dock：迷你番茄 + 操作 ===== -->
  <rect x="10" y="742" width="344" height="78" rx="20" fill="#FFFFFF"/>
  <rect x="10" y="742" width="344" height="1" fill="#EAEEF6"/>
  <circle cx="48" cy="781" r="17" fill="none" stroke="#EEF1F8" stroke-width="4.5"/>
  <circle cx="48" cy="781" r="17" fill="none" stroke="#6366F1" stroke-width="4.5" stroke-linecap="round"
          stroke-dasharray="53.4 106.8" transform="rotate(-90 48 781)"/>
  <text x="76" y="777" font-size="15" font-weight="700" fill="#0F172A">12:36</text>
  <text x="76" y="793" font-size="10" fill="#94A3B8">专注中 · 第 2 回合</text>
  <circle cx="176" cy="781" r="14" fill="url(#brand)"/>
  <path d="M171 774.5 l11 6.5 l-11 6.5 z" fill="#fff"/>
  <g transform="translate(232,768)" >
    <rect width="30" height="26" rx="8" fill="#F1F5F9"/>
    <path d="M8 17 v-6 M15 17 V9 M22 17 v-4" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g transform="translate(268,768)">
    <rect width="30" height="26" rx="8" fill="#F1F5F9"/>
    <path d="M15 8 v7 m0 0 l-3.5 -3.5 m3.5 3.5 l3.5 -3.5 M8 18 h14" stroke="#64748B" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(304,768)">
    <rect width="30" height="26" rx="8" fill="#F1F5F9"/>
    <g stroke="#64748B" stroke-width="1.6" stroke-linecap="round">
      <line x1="8" y1="10" x2="22" y2="10"/><line x1="8" y1="16" x2="22" y2="16"/>
      <circle cx="12" cy="10" r="2.1" fill="#F1F5F9"/><circle cx="18" cy="16" r="2.1" fill="#F1F5F9"/>
    </g>
  </g>
</svg>
