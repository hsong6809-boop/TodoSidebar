<svg xmlns="http://www.w3.org/2000/svg" width="600" height="780" viewBox="0 0 600 780" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <rect width="600" height="780" fill="#0B1220"/>
  <defs>
    <radialGradient id="ambient" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#6366F1" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818CF8"/><stop offset="0.55" stop-color="#A78BFA"/><stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="btn4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect x="10" y="8" width="560" height="744" rx="20" fill="#0D1526" stroke="#1E2A44"/>
  <rect x="10" y="8" width="560" height="744" rx="20" fill="url(#ambient)"/>

  <!-- 顶栏 -->
  <path d="M46 34 l-9 9 l9 9" stroke="#94A3B8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="70" y="48" font-size="15" font-weight="600" fill="#F1F5F9">专注</text>
  <circle cx="540" cy="43" r="13" fill="#FFFFFF" opacity="0.06"/>
  <g transform="translate(532,35)" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round">
    <line x1="2" y1="8" x2="14" y2="8"/><line x1="2" y1="3" x2="14" y2="3"/>
    <circle cx="6" cy="3" r="2" fill="#0D1526"/><circle cx="10" cy="8" r="2" fill="#0D1526"/>
  </g>

  <!-- 大番茄环 -->
  <circle cx="290" cy="300" r="118" fill="none" stroke="#1C2740" stroke-width="16"/>
  <circle cx="290" cy="300" r="118" fill="none" stroke="url(#ring4)" stroke-width="16" stroke-linecap="round"
          stroke-dasharray="520 741.4" transform="rotate(-90 290 300)"/>
  <circle cx="290" cy="300" r="98" fill="#0D1526" opacity="0.65"/>
  <text x="290" y="292" font-size="46" font-weight="700" fill="#F1F5F9" text-anchor="middle">18:24</text>
  <text x="290" y="320" font-size="12" fill="#94A3B8" text-anchor="middle">专注中 · 保持住</text>

  <!-- 回合圆点 -->
  <g>
    <circle cx="242" cy="452" r="7" fill="url(#btn4)"/>
    <circle cx="274" cy="452" r="7" fill="url(#btn4)"/>
    <circle cx="306" cy="452" r="7" fill="none" stroke="#33415E" stroke-width="2"/>
    <circle cx="338" cy="452" r="7" fill="none" stroke="#33415E" stroke-width="2"/>
  </g>
  <text x="290" y="480" font-size="11" fill="#64748B" text-anchor="middle">第 2 / 4 回合 · 完成后休息 5 分钟</text>

  <!-- 绑定任务 chip -->
  <rect x="170" y="498" width="240" height="36" rx="18" fill="#16203A" stroke="#26324B"/>
  <circle cx="190" cy="516" r="3" fill="#818CF8"/>
  <text x="202" y="521" font-size="11.5" fill="#CBD5E1">正在专注：<tspan font-weight="600" fill="#F1F5F9">写产品周报</tspan></text>
  <path d="M392 512 l5 5 l-5 5" stroke="#64748B" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 控制按钮 -->
  <rect x="196" y="556" width="128" height="46" rx="23" fill="url(#btn4)"/>
  <g transform="translate(232,569)">
    <rect x="0" y="0" width="4.5" height="20" rx="2" fill="#fff"/>
    <rect x="9.5" y="0" width="4.5" height="20" rx="2" fill="#fff"/>
  </g>
  <text x="282" y="585" font-size="14" font-weight="600" fill="#fff">暂停</text>
  <rect x="340" y="556" width="96" height="46" rx="23" fill="transparent" stroke="#33415E" stroke-width="1.5"/>
  <g transform="translate(360,570)">
    <rect x="0" y="0" width="17" height="17" rx="4" fill="none" stroke="#94A3B8" stroke-width="1.7"/>
    <rect x="5" y="5" width="7" height="7" rx="1.5" fill="#94A3B8"/>
  </g>
  <text x="388" y="585" font-size="13" fill="#CBD5E1">停止</text>

  <!-- 底部统计条 -->
  <rect x="60" y="640" width="460" height="64" rx="16" fill="#101B31" stroke="#1E2A44"/>
  <g transform="translate(100,656)">
    <text x="30" y="14" font-size="16" font-weight="700" fill="#F1F5F9" text-anchor="middle">3</text>
    <text x="30" y="32" font-size="9.5" fill="#64748B" text-anchor="middle">今日番茄</text>
  </g>
  <line x1="180" y1="664" x2="180" y2="704" stroke="#1E2A44"/>
  <g transform="translate(230,656)">
    <text x="30" y="14" font-size="16" font-weight="700" fill="#F1F5F9" text-anchor="middle">75 分</text>
    <text x="30" y="32" font-size="9.5" fill="#64748B" text-anchor="middle">专注时长</text>
  </g>
  <line x1="310" y1="664" x2="310" y2="704" stroke="#1E2A44"/>
  <g transform="translate(360,656)">
    <text x="30" y="14" font-size="16" font-weight="700" fill="#34D399" text-anchor="middle">+45</text>
    <text x="30" y="32" font-size="9.5" fill="#64748B" text-anchor="middle">本日经验</text>
  </g>
  <line x1="430" y1="664" x2="430" y2="704" stroke="#1E2A44"/>
  <g transform="translate(470,656)">
    <text x="20" y="14" font-size="16" font-weight="700" fill="#FBBF24" text-anchor="middle">🔥 6</text>
    <text x="20" y="32" font-size="9.5" fill="#64748B" text-anchor="middle">连击天数</text>
  </g>

  <!-- 快捷键提示 -->
  <text x="290" y="736" font-size="9.5" fill="#33415E" text-anchor="middle">Space 开始/暂停 · Esc 停止 · 中断不计入经验</text>
</svg>
